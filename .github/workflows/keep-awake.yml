# Keeps the study app awake: opens it every 4 hours (Streamlit sleeps after 12 h
# without visitors). Only looks at the first page, creates no data, and doesn't
# change the repo, so it never restarts the app.
name: keep-awake
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (UTC); GitHub may run it a bit late
  workflow_dispatch: {}      # "Run workflow" button for a manual test
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python tools/keep_awake.py https://gamestudy.streamlit.app/
